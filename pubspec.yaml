name: expedition_aurelio
description: Offline-first documentary field companion for Android.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_litert_lm: ^0.3.0
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  path: ^1.9.1
  dio: ^5.8.0+1
  uuid: ^4.5.1
  intl: ^0.20.2
  permission_handler: ^11.4.0
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  record: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/manual/
