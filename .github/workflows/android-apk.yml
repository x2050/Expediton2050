name: Expedition Aurelio Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Install Java required by the Android Gradle build
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Install Flutter stable and cache dependencies
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate missing Android Gradle project files
      - name: Generate Android platform scaffold
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --org org.expeditionaurelio .
          fi

      # LiteRT-LM requires Android API 24 or newer
      - name: Set minimum Android SDK
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          else
            echo "Android Gradle file missing"
            exit 1
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      # Preserve the APK for downloading from Actions
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: expedition-aurelio-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: expedition-aurelio-android-apk
          path: release-assets

      # Publish the APK when a version tag is pushed
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Expedition Aurelio ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/app-release.apk
